[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packaging-ml-agent"
version = "0.1.0"
description = "Machine Learning Scheduling Agent"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib"
]

[tool.setuptools.packages.find]
where = ["src"]