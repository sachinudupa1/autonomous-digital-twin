[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packaging-master-agent"
version = "0.1.0"
description = "Main Decision Agent for Packaging Scheduling"
requires-python = ">=3.13,<3.14"

dependencies = [
    "pydantic>=2,<3",
    "PyYAML"
]

[tool.setuptools.packages.find]
where = ["src"]