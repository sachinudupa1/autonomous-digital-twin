[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packaging-health-generator"
version = "0.1.0"
description = "Synthetic Machine Health Data Generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pydantic>=2,<3",
    "PyYAML"
]

[tool.setuptools.packages.find]
where = ["src"]
