# =====================================================================
# DEVELOPMENT DEFAULTS - ASSUMPTIONS ONLY
# None of these numbers are manufacturer specifications, calibrated sensor
# limits or industrial safety standards. They exist so the module can run
# and be tested. Teammate 1 (project owner) must approve or replace them.
# =====================================================================
config_version: "health-config-dev-1"
approval_status: "development_defaults_unapproved"

units:
  temperature: "C"
  vibration: "configured_unit"      # unit NOT yet approved by Teammate 1
  operating_duration: "minutes"

# Plausibility limits used to reject obviously invalid input (assumption).
valid_ranges:
  temperature:        {min: 0.0,  max: 150.0}
  vibration:          {min: 0.0,  max: 50.0}
  operating_duration: {min: 0.0,  max: 100000.0}

health_calculation:
  score_range:
    minimum: 0
    maximum: 100
  # Risk is 0 at/below `low` and 1 at/above `high` (higher value = worse).
  risk_ranges:
    temperature:        {low: 40.0,  high: 80.0}
    vibration:          {low: 2.0,   high: 10.0}
    operating_duration: {low: 240.0, high: 960.0}
  weights:                           # must sum to 1
    temperature: 0.5
    vibration: 0.3
    operating_duration: 0.2
  categories:                        # score >= minimum -> category
    normal:   {minimum: 80}
    warning:  {minimum: 60}
    abnormal: {minimum: 30}
    critical: {minimum: 0}
  required_readings: [temperature, vibration, operating_duration]

availability:
  allowed: [available, degraded, unavailable]
  default: available

generation:
  default_steps: 5
  normal_ranges:
    temperature:        {min: 35.0, max: 45.0}
    vibration:          {min: 1.0,  max: 3.0}
    operating_duration: {min: 30.0, max: 300.0}
  noise:                             # +/- uniform jitter applied to ramps
    temperature: 1.0
    vibration: 0.2
    operating_duration: 5.0

scenarios:
  normal:
    enabled: true
  increasing_temperature:
    enabled: true
    temperature: {start: 40.0, end: 60.0}
  high_vibration:
    enabled: true
    vibration: {start: 3.0, end: 12.0}
  prolonged_operation:
    enabled: true
    operating_duration: {start: 300.0, end: 1200.0}
  degraded:
    enabled: true
    availability: degraded
    temperature:        {min: 60.0,  max: 70.0}
    vibration:          {min: 5.0,   max: 8.0}
    operating_duration: {min: 600.0, max: 800.0}
  breakdown:
    enabled: true
    availability: unavailable
    temperature:        {min: 80.0,  max: 95.0}
    vibration:          {min: 10.0,  max: 14.0}
    operating_duration: {min: 700.0, max: 900.0}
  recovery:
    enabled: true
    availability_recovered_at: 0.5   # progress at which availability returns to 'available'
    start: {temperature: 70.0, vibration: 8.0, operating_duration: 700.0}
    end:   {temperature: 42.0, vibration: 2.0, operating_duration: 120.0}
  custom:
    enabled: true
